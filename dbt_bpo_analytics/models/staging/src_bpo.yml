version: 2

sources:
  - name: raw_bpo
    database: bpo_analytics
    schema: raw_bpo
    tables:
      - name: dim_agents
        columns:
          - name: agent_id
            tests:
              - unique
              - not_null
      - name: fact_shift_logs
        columns:
          - name: shift_id
            tests:
              - unique
              - not_null
      - name: fact_ticket_logs
        columns:
          - name: ticket_id
            tests:
              - unique
              - not_null
      - name: fact_csat_surveys
        columns:
          - name: survey_id
            tests:
              - unique
              - not_null